<div class="container">
 @for (exercise of list().exercises; track $index) {
    <div 
      class="exercise-item" [class.selected]="exercise.id===selectedExId"
      draggable="true"
      (dragstart)="onDragStart(exercise, $event)"
      (click)="onSelect(exercise)">
      {{ exercise.title }}
    </div>
  }
</div>
