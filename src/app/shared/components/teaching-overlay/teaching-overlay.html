<svg
  width="100%"
  height="100%"
  viewBox="0 0 8 8"
  preserveAspectRatio="none"
  style="position: absolute; top: 0; left: 0; pointer-events: none"
>

  <!-- ─── Jail ─────────────────────────────────────────────── -->
  @if (conceptId() === 'jail') {
    @let coord = squareCoord();
    @if (coord) {
      <!-- Dark fill -->
      <rect [attr.x]="coord.x" [attr.y]="coord.y" width="1" height="1" fill="rgba(0,0,0,0.38)"/>

      <!-- Vertical bars -->
        <rect [attr.x]="coord.x + 0.096" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
        </rect>
        <rect [attr.x]="coord.x + 0.322" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.08s" fill="freeze"/>
        </rect>
        <rect [attr.x]="coord.x + 0.548" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.16s" fill="freeze"/>
        </rect>
        <rect [attr.x]="coord.x + 0.774" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.24s" fill="freeze"/>
        </rect>

      <!-- Cage frame -->
      <rect [attr.x]="coord.x"        [attr.y]="coord.y" width="1"    height="0.07" fill="#111"/>
      <rect [attr.x]="coord.x"        [attr.y]="coord.y + 0.93" width="1" height="0.07" fill="#111"/>
      <rect [attr.x]="coord.x"        [attr.y]="coord.y" width="0.07" height="1"    fill="#111"/>
      <rect [attr.x]="coord.x + 0.93" [attr.y]="coord.y" width="0.07" height="1"    fill="#111"/>
    }
  }

  @if (conceptId() === 'surprise') {
     <image
      href="/images/surprise.png"
      x="2" y="2"
      width="4" height="4"
    />
  }
</svg>
