<svg
  width="100%"
  height="100%"
  viewBox="0 0 8 8"
  preserveAspectRatio="none"
  style="position: absolute; top: 0; left: 0; pointer-events: none"
>

  <!-- ─── Jail ─────────────────────────────────────────────── -->
  @if (conceptId() === 'jail') {
    @let coord = squareCoord();
    @if (coord) {
      <!-- Dark fill -->
      <rect [attr.x]="coord.x" [attr.y]="coord.y" width="1" height="1" fill="rgba(0,0,0,0.38)"/>

      <!-- Vertical bars -->
        <rect [attr.x]="coord.x + 0.096" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/>
        </rect>
        <rect [attr.x]="coord.x + 0.322" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.08s" fill="freeze"/>
        </rect>
        <rect [attr.x]="coord.x + 0.548" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.16s" fill="freeze"/>
        </rect>
        <rect [attr.x]="coord.x + 0.774" [attr.y]="coord.y" width="0.13" height="0" rx="0.04" fill="#2a2a2a">
          <animate attributeName="height" from="0" to="1" dur="0.6s" begin="0.24s" fill="freeze"/>
        </rect>

      <!-- Cage frame -->
      <rect [attr.x]="coord.x"        [attr.y]="coord.y" width="1"    height="0.07" fill="#111"/>
      <rect [attr.x]="coord.x"        [attr.y]="coord.y + 0.93" width="1" height="0.07" fill="#111"/>
      <rect [attr.x]="coord.x"        [attr.y]="coord.y" width="0.07" height="1"    fill="#111"/>
      <rect [attr.x]="coord.x + 0.93" [attr.y]="coord.y" width="0.07" height="1"    fill="#111"/>
    }
  }
  @if (conceptId() === 'castling1') {
     <image
      href="/images/castling1.png"
      x="2" y="2"
      width="4" height="4"
    />
  }
  @if (conceptId() === 'castling-dancing') {
     <image
      href="/images/castling-dancing.png"
      x="2" y="2"
      width="4" height="4"
    />
  }
  @if (conceptId() === 'spanish') {
     <image
      href="/images/spanish.png"
      x="2" y="2"
      width="4" height="4"
    />
  }
  @if (conceptId() === 'surprise') {
     <image
      href="/images/surprise.png"
      x="2" y="2"
      width="4" height="4"
    />
  }

    @if (conceptId() === 'tired') {
     <image
      href="/images/tired_cat.png"
      x="2" y="2"
      width="4" height="4"
    />
  }
  @if (conceptId() === 'phew') {
    @let coord = squareCoord();
    @if (coord) {
     <image
      href="/images/phew.png"
      [attr.x]="coord.x"
      [attr.y]="coord.y"
      width="1" height="1"
    />
    }
  }
    @if (conceptId() === 'target') {
    @let coord = squareCoord();
    @if (coord) {
     <image
      href="/images/target.png"
      [attr.x]="coord.x"
      [attr.y]="coord.y"
      width="1" height="1"
    />
    }
  }
  @if (conceptId() === 'poison') {
    @let coord = squareCoord();
    @if (coord) {
     <image
      href="/images/poison.png"
      [attr.x]="coord.x"
      [attr.y]="coord.y"
      width="1" height="1"
    />
    }
  }
  @if (conceptId() === 'happy') {
    @let coord = squareCoord();
    @if (coord) {
      <!-- Eyes -->
      <circle [attr.cx]="coord.x + 0.32" [attr.cy]="coord.y + 0.38" r="0.13" fill="white" stroke="#333" stroke-width="0.03"/>
      <circle [attr.cx]="coord.x + 0.32" [attr.cy]="coord.y + 0.38" r="0.07" fill="#111"/>
      <circle [attr.cx]="coord.x + 0.68" [attr.cy]="coord.y + 0.38" r="0.13" fill="white" stroke="#333" stroke-width="0.03"/>
      <circle [attr.cx]="coord.x + 0.68" [attr.cy]="coord.y + 0.38" r="0.07" fill="#111"/>
      <!-- Happy eyebrows — arching upward -->
      <path [attr.d]="'M ' + (coord.x+0.20) + ' ' + (coord.y+0.22) + ' Q ' + (coord.x+0.32) + ' ' + (coord.y+0.15) + ' ' + (coord.x+0.44) + ' ' + (coord.y+0.22)"
        fill="none" stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <path [attr.d]="'M ' + (coord.x+0.56) + ' ' + (coord.y+0.22) + ' Q ' + (coord.x+0.68) + ' ' + (coord.y+0.15) + ' ' + (coord.x+0.80) + ' ' + (coord.y+0.22)"
        fill="none" stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <!-- Big smile -->
      <path [attr.d]="'M ' + (coord.x+0.22) + ' ' + (coord.y+0.60) + ' Q ' + (coord.x+0.50) + ' ' + (coord.y+0.85) + ' ' + (coord.x+0.78) + ' ' + (coord.y+0.60)"
        fill="none" stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
    }
  }

  @if (conceptId() === 'sad') {
    @let coord = squareCoord();
    @if (coord) {
      <!-- Eyes -->
      <circle [attr.cx]="coord.x + 0.32" [attr.cy]="coord.y + 0.42" r="0.13" fill="white" stroke="#333" stroke-width="0.03"/>
      <circle [attr.cx]="coord.x + 0.32" [attr.cy]="coord.y + 0.42" r="0.07" fill="#111"/>
      <circle [attr.cx]="coord.x + 0.68" [attr.cy]="coord.y + 0.42" r="0.13" fill="white" stroke="#333" stroke-width="0.03"/>
      <circle [attr.cx]="coord.x + 0.68" [attr.cy]="coord.y + 0.42" r="0.07" fill="#111"/>
      <!-- Sad eyebrows — inner corners raised -->
      <line [attr.x1]="coord.x + 0.20" [attr.y1]="coord.y + 0.24"
            [attr.x2]="coord.x + 0.44" [attr.y2]="coord.y + 0.18"
            stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <line [attr.x1]="coord.x + 0.56" [attr.y1]="coord.y + 0.18"
            [attr.x2]="coord.x + 0.80" [attr.y2]="coord.y + 0.24"
            stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <!-- Frown -->
      <path [attr.d]="'M ' + (coord.x+0.25) + ' ' + (coord.y+0.76) + ' Q ' + (coord.x+0.50) + ' ' + (coord.y+0.60) + ' ' + (coord.x+0.75) + ' ' + (coord.y+0.76)"
        fill="none" stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <!-- Teardrop left eye -->
      <ellipse [attr.cx]="coord.x + 0.32" [attr.cy]="coord.y + 0.62" rx="0.04" ry="0.06" fill="#88bbff"/>
    }
  }
  @if(conceptId()==='alarmed'){
    @let pos = squareCoord();
    @if(pos){
     <circle [attr.cx]="pos.x + 0.32" [attr.cy]="pos.y + 0.45" r="0.13" fill="white" stroke="#333" stroke-width="0.03"/>
      <circle [attr.cx]="pos.x + 0.32" [attr.cy]="pos.y + 0.45" r="0.07" fill="#111"/>
      <circle [attr.cx]="pos.x + 0.68" [attr.cy]="pos.y + 0.45" r="0.13" fill="white" stroke="#333" stroke-width="0.03"/>
      <circle [attr.cx]="pos.x + 0.68" [attr.cy]="pos.y + 0.45" r="0.07" fill="#111"/>
      <line
        [attr.x1]="pos.x + 0.22" [attr.y1]="pos.y + 0.27"
        [attr.x2]="pos.x + 0.42" [attr.y2]="pos.y + 0.21"
        stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <line
        [attr.x1]="pos.x + 0.58" [attr.y1]="pos.y + 0.21"
        [attr.x2]="pos.x + 0.78" [attr.y2]="pos.y + 0.27"
        stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <ellipse
        [attr.cx]="pos.x + 0.5" [attr.cy]="pos.y + 0.72"
        rx="0.09" ry="0.07"
        stroke="#000" stroke-width="0.03" fill="white"/>
    }
  }
  @if(conceptId()==='checkmate'){
    @let pos = squareCoord();
    @if(pos){
      <line [attr.x1]="pos.x + 0.26" [attr.y1]="pos.y + 0.39" [attr.x2]="pos.x + 0.38" [attr.y2]="pos.y + 0.51" stroke="#111" stroke-width="0.06" stroke-linecap="round"/>
      <line [attr.x1]="pos.x + 0.38" [attr.y1]="pos.y + 0.39" [attr.x2]="pos.x + 0.26" [attr.y2]="pos.y + 0.51" stroke="#111" stroke-width="0.06" stroke-linecap="round"/>
      <line [attr.x1]="pos.x + 0.62" [attr.y1]="pos.y + 0.39" [attr.x2]="pos.x + 0.74" [attr.y2]="pos.y + 0.51" stroke="#111" stroke-width="0.06" stroke-linecap="round"/>
      <line [attr.x1]="pos.x + 0.74" [attr.y1]="pos.y + 0.39" [attr.x2]="pos.x + 0.62" [attr.y2]="pos.y + 0.51" stroke="#111" stroke-width="0.06" stroke-linecap="round"/>
      <line [attr.x1]="pos.x + 0.32" [attr.y1]="pos.y + 0.68" [attr.x2]="pos.x + 0.68" [attr.y2]="pos.y + 0.68" stroke="#111" stroke-width="0.05" stroke-linecap="round"/>
      <rect [attr.x]="pos.x + 0.49" [attr.y]="pos.y + 0.68" width="0.16" height="0.12" rx="0.05" fill="#e05555" stroke="#111" stroke-width="0.02"/>
    }
  }
</svg>
