<div class="board-wrapper">
  <div class="overlay-wrapper">
    <app-chess-board #chessBoard [config]="boardConfig()"></app-chess-board>
  </div>
  <div class="file-helper" [class.reversed]="myColor() === 'black'">
    <span>🍎</span><span>🍌</span><span>😺</span><span>🥁</span>
    <span>🐭</span><span>🪥</span><span>🍄</span><span>☃️</span>
  </div>
</div>
  @if (promotionService.pending()) {
    <app-promotion [color]="myColor()" (promote)="promotionService.completePromotion($event)"></app-promotion>
  }
