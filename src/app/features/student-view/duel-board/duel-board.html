<div class="duel-layout">
  <div class="main-board-area">
    <div class="overlay-wrapper" (mouseup)="onMouseUp($event)">
      <app-chess-board #chessBoard gameMode='duel' [config]="boardConfig()"></app-chess-board>
    </div>
  </div>
  @if (promotionService.pending()) {
    <app-promotion color="black" (promote)="promotionService.completePromotion($event)"></app-promotion>
  }
</div>
