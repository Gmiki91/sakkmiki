<div class="page-center">
  @if (phase() === 'idle') {
    <div class="setup-panel">
      <h2>Puzzle Rush</h2>

      <mat-card class="settings-card">
        <mat-card-header>
          <mat-card-title>Settings</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="setting-row">
            <label>Duration (seconds)</label>
            <input matInput type="number" [(ngModel)]="duration"/>
          </div>
          <div class="setting-row">
            <label>Bonus on correct (seconds)</label>
            <input matInput type="number" [(ngModel)]="timeBonus"/>
          </div>
          <div class="setting-row">
            <label>Penalty on wrong (seconds)</label>
            <input matInput type="number" [(ngModel)]="timePenalty"/>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="list-card">
        <mat-card-content>
          @if (selectedList()) {
            <div class="selected-list">
              <span>{{ selectedList()!.title }}</span>
              <span class="meta">{{ selectedList()!.exercises.length }} puzzles</span>
              <button mat-icon-button (click)="openListPicker()">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          } @else {
            <button mat-stroked-button (click)="openListPicker()">
              Select puzzle list
            </button>
          }
        </mat-card-content>
      </mat-card>

      <button
        mat-raised-button
        color="primary"
        [disabled]="!selectedList()"
        (click)="start()">
        Start Rush
      </button>
    </div>
  }

  @if (phase() === 'running' || phase() === 'finished') {
    <app-puzzle-rush-board
      [exercises]="selectedList()?.exercises ?? []"
      [duration]="duration()"
      [timeBonus]="timeBonus()"
      [timePenalty]="timePenalty()"
      (finished)="onFinished()"
    ></app-puzzle-rush-board>

    @if (phase() === 'finished') {
      <button mat-raised-button color="primary" (click)="restart()">Setup again</button>
    }
  }
</div>
