@if (isLoading()) {
  <div class="classroom-loading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
} @else {
  <div class="classroom-container" [class.gathered]="store.mode() === 'gathered'">
    @if (isOwner()) {
      <app-teacher-desk></app-teacher-desk>
    } @else {
      <app-spectator-view></app-spectator-view>
    }
    @if (store.mode() !== 'gathered') {
      <app-student-roster [readonly]="!isOwner()"></app-student-roster>
    }
  </div>
}
